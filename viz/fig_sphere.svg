<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 334" role="img" aria-label="&alpha;=0 の座標は半径1の球面上にあり、2体の差は球面を貫く弦で、弧より 2〜4% 短いことを示す図" style="width:100%;height:auto;display:block;font-family:Hiragino Sans,Noto Sans CJK JP,sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="currentColor"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1c4f8c"/></marker></defs><path d="M159.5,220.0 A220,220 0 0 1 540.5,220.0" fill="none" stroke="currentColor" stroke-width="1.6" opacity="0.4"/><text x="161.47441116742348" y="208.0" font-size="11" text-anchor="start" font-weight="normal" fill="currentColor" opacity="0.7">&#8214;z&#8214; = 1 の球面（22体すべてが乗る）</text><path d="M208.6,161.5 A220,220 0 0 1 491.4,161.5" fill="none" stroke="#1c4f8c" stroke-width="3.5"/><line x1="208.6" y1="161.5" x2="491.4" y2="161.5" stroke="currentColor" stroke-width="2"/><text x="350" y="96.0" font-size="11.5" text-anchor="middle" font-weight="600" fill="#1c4f8c">弧 = Fisher&ndash;Rao 測地線 2arccos(BC)</text><text x="350" y="185.47022251382484" font-size="11.5" text-anchor="middle" font-weight="600" fill="currentColor">弦 = 座標の差 &#8214;z &minus; b&#8214;</text><text x="350" y="203.47022251382484" font-size="10.5" text-anchor="middle" font-weight="normal" fill="currentColor" opacity="0.68">この2本の長さの比が 0.957&ndash;0.981</text><circle cx="208.6" cy="161.5" r="5.5" fill="currentColor" stroke="#fff" stroke-width="2"/><text x="197.58672586896134" y="165.47022251382484" font-size="11.5" text-anchor="end" font-weight="600" fill="currentColor">基準 h4</text><circle cx="491.4" cy="161.5" r="5.5" fill="currentColor" stroke="#fff" stroke-width="2"/><text x="502.41327413103863" y="165.47022251382484" font-size="11.5" text-anchor="start" font-weight="600" fill="currentColor">別のエージェント</text><rect x="28" y="252" width="300" height="62" rx="3" fill="none" stroke="currentColor" stroke-width="1.4"/><text x="178.0" y="279.5" font-size="12.5" text-anchor="middle" font-weight="600" fill="currentColor">座標の差は接ベクトルではない</text><text x="178.0" y="295.5" font-size="10.5" text-anchor="middle" font-weight="normal" fill="currentColor" opacity="0.72">弦の和は球面に乗らない</text><rect x="372" y="252" width="300" height="62" rx="3" fill="none" stroke="#1c4f8c" stroke-width="2"/><text x="522.0" y="279.5" font-size="12.5" text-anchor="middle" font-weight="600" fill="#1c4f8c">それでも接空間に移して足すと</text><text x="522.0" y="295.5" font-size="10.5" text-anchor="middle" font-weight="normal" fill="currentColor" opacity="0.72">cos 0.995 &rarr; 0.995（変わらない）</text></svg>