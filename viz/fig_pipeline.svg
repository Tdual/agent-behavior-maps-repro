opacity="0.78">同じ履歴と行動</text><line x1="368" y1="74" x2="426" y2="74" stroke="currentColor" stroke-width="1.4" marker-end="url(#ar)"/><line x1="596" y1="74" x2="654" y2="74" stroke="currentColor" stroke-width="1.4" marker-end="url(#ar)"/><line x1="368" y1="214" x2="426" y2="214" stroke="currentColor" stroke-width="1.4" marker-end="url(#ar)"/><line x1="596" y1="214" x2="654" y2="214" stroke="currentColor" stroke-width="1.4" marker-end="url(#ar)"/><text x="397" y="62" font-size="10.5" text-anchor="middle" font-weight="normal" fill="currentColor" opacity="0.78">教師強制</text><text x="397" y="96" font-size="10.5" text-anchor="middle" font-weight="normal" fill="currentColor" opacity="0.78">で採点</text><text x="397" y="202" font-size="10.5" text-anchor="middle" font-weight="normal" fill="currentColor" opacity="0.78">教師強制</text><text x="397" y="236" font-size="10.5" text-anchor="middle" font-weight="normal" fill="currentColor" opacity="0.78">で採点</text><text x="625" y="62" font-size="10.5" text-anchor="middle" font-weight="normal" fill="currentColor" opacity="0.78">中心化</text><text x="625" y="96" font-size="10.5" text-anchor="middle" font-weight="normal" fill="currentColor" opacity="0.78">&times; M<tspan dy='-5' font-size='8'>&minus;1/2</tspan></text><text x="625" y="202" font-size="10.5" text-anchor="middle" font-weight="normal" fill="currentColor" opacity="0.78">中心化</text><text x="625" y="236" font-size="10.5" text-anchor="middle" font-weight="normal" fill="currentColor" opacity="0.78">&times; M<tspan dy='-5' font-size='8'>&minus;1/2</tspan></text><rect x="790" y="96" width="84" height="96" rx="3" fill="none" stroke="#1c4f8c" stroke-width="2"/><text x="832.0" y="132.5" font-size="12.5" text-anchor="middle" font-weight="600" fill="#1c4f8c">&#8214;z<tspan dy='3' font-size='9'>i</tspan><tspan dy='-3'>&minus;z</tspan><tspan dy='3' font-size='9'>j</tspan><tspan dy='-3'>&#8214;</tspan></text><text x="832.0" y="148.5" font-size="10.5" text-anchor="middle" font-weight="normal" fill="currentColor" opacity="0.72">距離</text><text x="832.0" y="164.5" font-size="10.5" text-anchor="middle" font-weight="normal" fill="currentColor" opacity="0.72">= 地図</text><line x1="774" y1="84" x2="802" y2="94" stroke="#1c4f8c" stroke-width="1.4" marker-end="url(#ara)"/><line x1="774" y1="204" x2="802" y2="194" stroke="#1c4f8c" stroke-width="1.4" marker-end="url(#ara)"/><text x="440.0" y="324" font-size="11" text-anchor="middle" font-weight="normal" fill="currentColor" opacity="0.62">ロールアウトは1本も走らせない。前向き計算だけで座標が決まる。</text></svg>