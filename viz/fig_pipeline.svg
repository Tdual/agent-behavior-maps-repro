<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" role="img" aria-label="共通の参照軌跡を2体のエージェントに教師強制で採点させ、対数尤度を並べて中心化した座標の差で距離を測る流れ" style="width:100%;height:auto;display:block;font-family:Hiragino Sans,Noto Sans CJK JP,sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="currentColor"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1c4f8c"/></marker></defs><rect x="8" y="92" width="128" height="104" rx="3" fill="none" stroke="currentColor" stroke-width="1.4"/><text x="72.0" y="132.5" font-size="12.5" text-anchor="middle" font-weight="600" fill="currentColor">参照軌跡</text><text x="72.0" y="148.5" font-size="10.5" text-anchor="middle" font-weight="normal" fill="currentColor" opacity="0.72">全員で共通</text><text x="72.0" y="164.5" font-size="10.5" text-anchor="middle" font-weight="normal" fill="currentColor" opacity="0.72">M = 193 ステップ</text><rect x="214" y="34" width="150" height="80" rx="3" fill="none" stroke="currentColor" stroke-width="1.4"/><text x="289.0" y="70.5" font-size="12.5" text-anchor="middle" font-weight="600" fill="currentColor">エージェント i</text><text x="289.0" y="86.5" font-size="10.5" text-anchor="middle" font-weight="normal" fill="currentColor" opacity="0.72">LLM + ハーネス</text><rect x="430" y="34" width="162" height="80" rx="3" fill="none" stroke="currentColor" stroke-width="1.4"/><text x="511.0" y="62.5" font-size="12.5" text-anchor="middle" font-weight="600" fill="currentColor">&#8467;<tspan dy='3' font-size='9'>i</tspan><tspan dy='-3'> = log &pi;</tspan></text><text x="511.0" y="78.5" font-size="10.5" text-anchor="middle" font-weight="normal" fill="currentColor" opacity="0.72">記録された行動の</text><text x="511.0" y="94.5" font-size="10.5" text-anchor="middle" font-weight="normal" fill="currentColor" opacity="0.72">対数尤度を M 個</text